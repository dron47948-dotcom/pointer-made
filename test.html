<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointer made</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --card: #161616;
            --border: #252525;
            --text: #e0e0e0;
            --sub: #777777;
            --accent: #4da8da;
            --accent-hover: #3d94c4;
            --green: #5cb87a;
            --green-bg: rgba(92, 184, 122, 0.1);
            --red: #e05555;
            --gold: #c9a94e;
            --gold-bg: rgba(201, 169, 78, 0.15);
            --silver: #b0b0b0;
            --silver-bg: rgba(176, 176, 176, 0.1);
            --bronze: #b8764a;
            --bronze-bg: rgba(184, 118, 74, 0.1);
            --copy: #3b7dd8;
            --copy-hover: #4d8ee6;
            --edit: #3b7dd8;
            --new: #4da8da;
            --up: #5cb87a;
            --down: #e05555;
            --tag-bg: #1e2230;
            --tag-text: #89b4fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            width: 750px;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
        }

        .header {
            padding: 22px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(12px);
            z-index: 50;
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(77, 168, 218, 0.6);
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #fff;
        }

        .header-title span {
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .points-badge {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .points-badge strong {
            color: var(--accent);
            font-weight: 600;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
        }

        .avatar:hover {
            border-color: var(--accent);
            background: #1a1a1a;
        }

        .tabs {
            display: flex;
            padding: 0 28px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: sticky;
            top: 77px;
            z-index: 40;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--sub);
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.3px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .search-wrapper {
            padding: 12px 28px;
            border-bottom: 1px solid var(--border);
        }

        .search-input {
            width: 100%;
            padding: 9px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            letter-spacing: 0.3px;
            transition: border 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--sub);
        }

        .content {
            padding: 14px 28px 120px;
            min-height: calc(100vh - 200px);
        }

        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .list-header-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--sub);
            font-weight: 600;
        }

        .legacy-date {
            font-size: 10px;
            color: var(--sub);
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--sub);
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .level-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .level-card {
            background: var(--card);
            border: 1px solid transparent;
            border-bottom: 1px solid var(--border);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.15s;
            border-radius: 0;
        }

        .level-card:first-child {
            border-radius: 8px 8px 0 0;
        }

        .level-card:last-child {
            border-radius: 0 0 8px 8px;
        }

        .level-card:only-child {
            border-radius: 8px;
        }

        .level-card:hover {
            background: #1a1a1a;
            border-color: var(--border);
        }

        .level-card.top-1 {
            border-left: 3px solid var(--gold);
        }

        .level-card.top-2 {
            border-left: 3px solid var(--silver);
        }

        .level-card.top-3 {
            border-left: 3px solid var(--bronze);
        }

        .level-rank {
            font-size: 12px;
            color: var(--sub);
            font-weight: 600;
            min-width: 36px;
            letter-spacing: 0.5px;
        }

        .level-card.top-1 .level-rank {
            color: var(--gold);
        }

        .level-card.top-2 .level-rank {
            color: var(--silver);
        }

        .level-card.top-3 .level-rank {
            color: var(--bronze);
        }

        .level-info {
            flex: 1;
            min-width: 0;
        }

        .level-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .level-name {
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        .legacy-badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .legacy-badge.legacy-1 {
            background: var(--gold-bg);
            color: var(--gold);
        }

        .legacy-badge.legacy-2 {
            background: var(--silver-bg);
            color: var(--silver);
        }

        .legacy-badge.legacy-3 {
            background: var(--bronze-bg);
            color: var(--bronze);
        }

        .history-badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .history-badge.up {
            background: rgba(92, 184, 122, 0.15);
            color: var(--up);
        }

        .history-badge.down {
            background: rgba(224, 85, 85, 0.15);
            color: var(--down);
        }

        .history-badge.new {
            background: rgba(77, 168, 218, 0.15);
            color: var(--new);
        }

        .level-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .level-tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.3px;
        }

        .level-details {
            font-size: 11px;
            color: var(--sub);
            margin-top: 3px;
            letter-spacing: 0.2px;
        }

        .level-details strong {
            color: var(--text);
            font-weight: 500;
        }

        .level-difficulty-bar {
            height: 2px;
            background: var(--border);
            border-radius: 1px;
            margin-top: 6px;
        }

        .level-difficulty-fill {
            height: 100%;
            border-radius: 1px;
            background: var(--accent);
        }

        .level-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .edit-btn {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--edit);
        }

        .edit-btn:hover {
            background: rgba(59, 125, 216, 0.15);
            border-color: var(--edit);
        }

        .edit-btn svg {
            width: 13px;
            height: 13px;
        }

        .complete-btn {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--green);
        }

        .complete-btn:hover:not(.completed) {
            background: var(--green-bg);
            border-color: var(--green);
        }

        .complete-btn.completed {
            background: var(--green-bg);
            border-color: rgba(92, 184, 122, 0.3);
            cursor: default;
            opacity: 0.7;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--sub);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.2s;
            line-height: 1;
        }

        .delete-btn:hover {
            color: var(--red);
            border-color: rgba(224, 85, 85, 0.3);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 750px;
            padding: 16px 28px;
            background: linear-gradient(transparent, rgba(10, 10, 10, 0.95) 30%, rgba(10, 10, 10, 1) 100%);
            display: flex;
            gap: 10px;
            z-index: 40;
        }

        .add-btn {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .add-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px rgba(77, 168, 218, 0.3);
        }

        .copy-btn {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: var(--copy);
            border: none;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .copy-btn:hover {
            background: var(--copy-hover);
            box-shadow: 0 0 20px rgba(59, 125, 216, 0.3);
        }

        .copy-btn svg {
            width: 16px;
            height: 16px;
        }

        .copy-tooltip {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .copy-tooltip.show {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 26px 28px;
            width: 420px;
        }

        .modal h2 {
            font-size: 16px;
            margin-bottom: 18px;
            font-weight: 500;
            color: #fff;
        }

        .modal label {
            display: block;
            font-size: 11px;
            color: var(--sub);
            margin-bottom: 4px;
            margin-top: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        .modal input[type="text"],
        .modal input[type="number"] {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }

        .modal input:focus {
            border-color: var(--accent);
        }

        .modal input[type="range"] {
            width: 100%;
            margin-top: 4px;
            accent-color: var(--accent);
            height: 4px;
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-row input[type="range"] {
            flex: 1;
        }

        .range-value {
            font-weight: 500;
            color: var(--accent);
            font-size: 13px;
            min-width: 30px;
            text-align: right;
        }

        .modal-hint {
            font-size: 10px;
            color: var(--sub);
            margin-top: 3px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 22px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 9px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-cancel:hover {
            background: #1a1a1a;
        }

        .btn-ok {
            background: var(--accent);
            color: #fff;
        }

        .btn-ok:hover {
            background: var(--accent-hover);
        }

        .tag-input-wrapper {
            position: relative;
        }

        .tag-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0 0 6px 6px;
            max-height: 140px;
            overflow-y: auto;
            z-index: 101;
            display: none;
        }

        .tag-suggestions.show {
            display: block;
        }

        .tag-suggestion-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text);
            transition: background 0.1s;
        }

        .tag-suggestion-item:hover {
            background: var(--card);
            color: var(--accent);
        }

        .profile-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 200;
            overflow-y: auto;
        }

        .profile-page.active {
            display: block;
        }

        .profile-container {
            max-width: 550px;
            margin: 0 auto;
            padding: 24px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--accent);
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            color: var(--accent);
            margin: 0 auto 16px;
        }

        .profile-name-input {
            display: block;
            width: 100%;
            max-width: 280px;
            margin: 0 auto 4px;
            text-align: center;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            padding: 6px 0;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }

        .profile-name-input:focus {
            border-bottom-color: var(--accent);
        }

        .profile-subtitle {
            text-align: center;
            color: var(--sub);
            font-size: 12px;
            margin-bottom: 24px;
        }

        .profile-stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 18px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-stat-label {
            color: var(--sub);
            font-size: 12px;
        }

        .profile-stat-value {
            font-weight: 500;
            font-size: 14px;
            color: #fff;
        }

        .profile-stat-value.accent {
            color: var(--accent);
        }

        .profile-section {
            margin-top: 22px;
        }

        .profile-section h3 {
            font-size: 11px;
            color: var(--sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .profile-completed-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 14px;
            margin-bottom: 2px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-completed-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        .profile-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .profile-action-btn {
            padding: 9px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .profile-action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .profile-action-btn.export-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .profile-action-btn.import-btn:hover {
            border-color: var(--copy);
            color: var(--copy);
        }

        .profile-action-btn.copy-profile-btn {
            background: var(--accent);
            color: #fff;
            border: none;
        }

        .profile-action-btn.copy-profile-btn:hover {
            background: var(--accent-hover);
        }

        .radar-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .radar-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
            color: var(--sub);
        }

        .radar-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .radar-legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .radar-legend-dot.overall {
            background: var(--accent);
            box-shadow: 0 0 6px rgba(77, 168, 218, 0.5);
        }

        .ach-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
        }

        .ach-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            letter-spacing: 0.3px;
        }

        .ach-card.earned {
            opacity: 1;
        }

        .ach-card.locked {
            opacity: 0.4;
        }

        .ach-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
        }

        .ach-card.earned .ach-icon {
            background: var(--green-bg);
            color: var(--green);
        }

        .ach-card.locked .ach-icon {
            background: var(--border);
            color: var(--sub);
        }

        .ach-info {
            flex: 1;
            min-width: 0;
        }

        .ach-name {
            font-weight: 500;
            color: var(--text);
        }

        .ach-card.locked .ach-name {
            color: var(--sub);
        }

        .ach-desc {
            color: var(--sub);
            font-size: 9px;
            margin-top: 1px;
        }

        .ach-count {
            font-size: 12px;

    <script>
        // ====== STORAGE KEYS ======
        const SK = {
            levels: 'pointer_made_levels_v3',
            points: 'pointer_made_points_v3',
            completed: 'pointer_made_completed_v3',
            name: 'pointer_made_name_v3',
            legacy: 'pointer_made_legacy_v3',
            legacyDate: 'pointer_made_legacy_date_v3',
            history: 'pointer_made_history_v3',
            prevSorted: 'pointer_made_prev_sorted_v3',
            allTags: 'pointer_made_tags_v3',
            levelTags: 'pointer_made_level_tags_v3',
            achievements: 'pointer_made_achievements_v3',
            achStats: 'pointer_made_ach_stats_v3',
            migrated: 'pointer_made_migrated_to_v3'
        };

        // ====== MIGRATION ======
        if (localStorage.getItem(SK.migrated) !== 'true') {
            ['levels', 'points', 'completed', 'name'].forEach(k => {
                const old = localStorage.getItem('pointer_made_' + k + '_v2');
                if (old !== null) localStorage.setItem(SK[k], old);
            });
            localStorage.setItem(SK.migrated, 'true');
        }

        // ====== DATA ======
        let levels = JSON.parse(localStorage.getItem(SK.levels) || '[]');
        let totalPoints = parseFloat(localStorage.getItem(SK.points) || '0');
        let completedIds = JSON.parse(localStorage.getItem(SK.completed) || '[]');
        let profileName = localStorage.getItem(SK.name) || 'Uruman';
        let legacyLevels = JSON.parse(localStorage.getItem(SK.legacy) || '[]');
        let legacyDate = localStorage.getItem(SK.legacyDate) || '';
        let historyLog = JSON.parse(localStorage.getItem(SK.history) || '[]');
        let prevSortedIds = JSON.parse(localStorage.getItem(SK.prevSorted) || '[]');
        let allTags = JSON.parse(localStorage.getItem(SK.allTags) || '[]');
        let levelTags = JSON.parse(localStorage.getItem(SK.levelTags) || '{}');
        let earnedAchievements = JSON.parse(localStorage.getItem(SK.achievements) || '[]');
        let achStats = JSON.parse(localStorage.getItem(SK.achStats) || '{}');

        function saveAll() {
            localStorage.setItem(SK.levels, JSON.stringify(levels));
            localStorage.setItem(SK.points, totalPoints.toFixed(6));
            localStorage.setItem(SK.completed, JSON.stringify(completedIds));
            localStorage.setItem(SK.name, profileName);
            localStorage.setItem(SK.legacy, JSON.stringify(legacyLevels));
            localStorage.setItem(SK.legacyDate, legacyDate);
            localStorage.setItem(SK.history, JSON.stringify(historyLog));
            localStorage.setItem(SK.prevSorted, JSON.stringify(prevSortedIds));
            localStorage.setItem(SK.allTags, JSON.stringify(allTags));
            localStorage.setItem(SK.levelTags, JSON.stringify(levelTags));
            localStorage.setItem(SK.achievements, JSON.stringify(earnedAchievements));
            localStorage.setItem(SK.achStats, JSON.stringify(achStats));
        }

        function formatPoints(n) { return parseFloat(n).toFixed(2); }
        function sortLevels(a, b) { if (b.difficulty !== a.difficulty) return b.difficulty - a.difficulty; return b.number - a.number; }
        function getSorted(source) { return [...source].sort(sortLevels); }
        function getTags(id) { return levelTags[id] || []; }
        function setTags(id, tags) { const c = tags.map(t => t.trim().toLowerCase()).filter(t => t); levelTags[id] = c; c.forEach(t => { if (!allTags.includes(t)) allTags.push(t); }); saveAll(); }
        function removeTags(id) { delete levelTags[id]; saveAll(); }

        // ====== LEGACY ======
        function checkLegacy() {
            if (!legacyDate) { saveLegacy(); return; }
            if ((new Date() - new Date(legacyDate)) / 86400000 >= 20) saveLegacy();
        }
        function saveLegacy() {
            if (levels.length === 0) { legacyLevels = []; legacyDate = ''; }
            else {
                legacyLevels = JSON.parse(JSON.stringify(getSorted(levels)));
                legacyDate = new Date().toISOString();
                if (!achStats.legacyCount) achStats.legacyCount = 0;
                achStats.legacyCount++;
                const s1 = getSorted(legacyLevels);
                if (s1.length > 0) {
                    const prev = achStats.prevLegacyTop1;
                    if (prev && prev === s1[0].id) achStats.sameTop1 = (achStats.sameTop1 || 0) + 1;
                    else if (prev && (achStats.sameTop1 || 0) > 0 && s1[0].id === achStats.comebackId) achStats.comeback = true;
                    achStats.prevLegacyTop1 = s1[0].id;
                    achStats.comebackId = prev;
                }
            }
            saveAll();
            checkAchievements();
        }

        // ====== HISTORY ======
        function cleanHistory() {
            const d = Date.now() - 86400000;
            historyLog = historyLog.filter(h => h.time > d).slice(0, 50);
            saveAll();
        }
        function addHistory(id, type, pos) {
            cleanHistory();
            historyLog.unshift({ levelId: id, type, positions: pos, time: Date.now() });
            if (historyLog.length > 50) historyLog.pop();
            saveAll();
        }
        function getHistory(id) { return historyLog.find(h => h.levelId === id) || null; }
        function computeHistory(newIds) {
            if (!prevSortedIds.length) { prevSortedIds = [...newIds]; saveAll(); return; }
            const om = {}, nm = {};
            prevSortedIds.forEach((id, i) => om[id] = i);
            newIds.forEach((id, i) => nm[id] = i);
            const oi = new Set(prevSortedIds), ni = new Set(newIds);
            newIds.forEach(id => { if (!oi.has(id)) addHistory(id, 'new', 0); });
            prevSortedIds.forEach(id => { if (!ni.has(id)) addHistory(id, 'removed', 0); });
            newIds.forEach(id => {
                if (oi.has(id) && ni.has(id)) {
                    const d = om[id] - nm[id];
                    if (d) addHistory(id, d > 0 ? 'up' : 'down', Math.abs(d));
                }
            });
            prevSortedIds = [...newIds];
            saveAll();
        }

        // ====== ACHIEVEMENTS ======
        const ACHIEVEMENTS = [

            { id: 14, name: "Halfway There", desc: "Complete a level with 50+ difficulty", check: () => levels.filter(l => completedIds.includes(l.id) && l.difficulty >= 50).length > 0 },
            { id: 15, name: "Warming Up", desc: "Complete a level with 25+ difficulty", check: () => levels.filter(l => completedIds.includes(l.id) && l.difficulty >= 25).length > 0 },
            { id: 16, name: "Triple Kill", desc: "Complete 3 levels in one day", check: () => { const g = {}; completedIds.forEach(id => { const d = new Date(achStats.completedDates?.[id] || 0).toDateString(); g[d] = (g[d] || 0) + 1; }); return Object.values(g).some(v => v >= 3); } },
            { id: 17, name: "On Fire", desc: "Complete 5 levels in one day", check: () => { const g = {}; completedIds.forEach(id => { const d = new Date(achStats.completedDates?.[id] || 0).toDateString(); g[d] = (g[d] || 0) + 1; }); return Object.values(g).some(v => v >= 5); } },
            { id: 18, name: "Unstoppable", desc: "Complete 10 levels in one day", check: () => { const g = {}; completedIds.forEach(id => { const d = new Date(achStats.completedDates?.[id] || 0).toDateString(); g[d] = (g[d] || 0) + 1; }); return Object.values(g).some(v => v >= 10); } },
            { id: 19, name: "Marathon", desc: "Complete 20 levels in one day", check: () => { const g = {}; completedIds.forEach(id => { const d = new Date(achStats.completedDates?.[id] || 0).toDateString(); g[d] = (g[d] || 0) + 1; }); return Object.values(g).some(v => v >= 20); } },
            { id: 20, name: "Insanity", desc: "Complete 50 levels in one day", check: () => { const g = {}; completedIds.forEach(id => { const d = new Date(achStats.completedDates?.[id] || 0).toDateString(); g[d] = (g[d] || 0) + 1; }); return Object.values(g).some(v => v >= 50); } },
            { id: 21, name: "Night Owl", desc: "Complete a level between 00:00 and 05:00", check: () => { const c = achStats.completedDates || {}; return Object.values(c).some(d => { const h = new Date(d).getHours(); return h >= 0 && h < 5; }); } },

            { id: 37, name: "Godslayer", desc: "Complete a 100 difficulty level", check: () => levels.filter(l => completedIds.includes(l.id) && l.difficulty === 100).length > 0 },
            { id: 38, name: "Difficulty Curve", desc: "Levels with 10+ different difficulty values", check: () => new Set(levels.map(l => l.difficulty)).size >= 10 },

            { id: 40, name: "Full Spectrum", desc: "Difficulty from 0 to 100", check: () => { const s = new Set(levels.map(l => l.difficulty)); return s.has(0) && s.has(100); } },

            const arr = [...dates].sort();
            let max = 0, cur = 1;
            for (let i = 1; i < arr.length; i++) {
                if ((new Date(arr[i]) - new Date(arr[i - 1])) / 86400000 === 1) cur++;

            return Math.max(max, cur) >= n;

        // ====== RADAR CHART ======
        function drawRadar() {
            const ctx = radarCanvas.getContext('2d');
            const done = levels.filter(l => completedIds.includes(l.id));
            if (!done.length) { radarContainer.style.display = 'none'; radarEmpty.style.display = 'block'; return; }

            const stats = {};
            done.forEach(l => getTags(l.id).forEach(t => { if (!stats[t]) stats[t] = { total: 0, count: 0 }; stats[t].total += l.difficulty; stats[t].count++; }));
            const names = Object.keys(stats);
            if (names.length < 2) {
                radarContainer.style.display = 'none';
                radarEmpty.style.display = 'block';
                radarEmpty.textContent = 'Need at least 2 tags to show radar chart';
                return;
            }

            const display = names.slice(0, 20);
            const num = display.length + 1;
            const ovTotal = done.reduce((s, l) => s + l.difficulty, 0);
            const ovCount = done.length;
            const allVals = [...display.map(t => stats[t].total), ovTotal];
            const maxV = Math.max(...allVals, 1);

            radarContainer.style.display = 'flex';
            radarEmpty.style.display = 'none';

            const sz = 280, cx = sz / 2, cy = sz / 2, r = 100;
            ctx.clearRect(0, 0, sz, sz);

            for (let ri = 1; ri <= 4; ri++) {
                ctx.beginPath();
                for (let i = 0; i < num; i++) { const a = Math.PI * 2 / num * i - Math.PI / 2; const x = cx + r * (ri / 4) * Math.cos(a); const y = cy + r * (ri / 4) * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
                ctx.closePath(); ctx.strokeStyle = '#252525'; ctx.lineWidth = 0.5; ctx.stroke();
            }
            for (let i = 0; i < num; i++) { const a = Math.PI * 2 / num * i - Math.PI / 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke(); }

            const cols = ['#c9a94e', '#b0b0b0', '#b8764a', '#89b4fa', '#a6e3a1', '#fab387', '#f38ba8', '#cba6f7', '#94e2d5', '#f9e2af', '#74c7ec', '#f5c2e7', '#a6adc8', '#eba0ac', '#89dceb', '#b4befe', '#f5e0dc', '#a6e3a1', '#89b4fa', '#c9a94e'];
            ctx.beginPath();
            for (let i = 0; i < num; i++) {
                const val = i < display.length ? stats[display[i]].total : ovTotal;
                const ratio = val / maxV;
                const a = Math.PI * 2 / num * i - Math.PI / 2;
                const x = cx + r * ratio * Math.cos(a), y = cy + r * ratio * Math.sin(a);
                i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            }
            ctx.closePath(); ctx.fillStyle = 'rgba(77,168,218,0.2)'; ctx.fill(); ctx.strokeStyle = '#4da8da'; ctx.lineWidth = 2; ctx.stroke();

            for (let i = 0; i < num; i++) {
                const val = i < display.length ? stats[display[i]].total : ovTotal;
                const ratio = val / maxV;
                const a = Math.PI * 2 / num * i - Math.PI / 2;
                const x = cx + r * ratio * Math.cos(a), y = cy + r * ratio * Math.sin(a);
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = i < display.length ? cols[i % cols.length] : '#4da8da'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
            }

            const fs = num > 12 ? 8 : (num > 8 ? 9 : 10);
            ctx.font = fs + "px 'Segoe UI', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let i = 0; i < num; i++) {
                const a = Math.PI * 2 / num * i - Math.PI / 2, lr = r + 22, x = cx + lr * Math.cos(a), y = cy + lr * Math.sin(a);
                ctx.fillStyle = i < display.length ? cols[i % cols.length] : '#4da8da';
                ctx.fillText(i < display.length ? display[i] : 'Overall', x, y);
            }

            radarLegend.innerHTML = '';
            display.forEach((t, i) => { const d = document.createElement('div'); d.className = 'radar-legend-item'; d.innerHTML = `<span class="radar-legend-dot" style="background:${cols[i % cols.length]}"></span> ${t} — ${stats[t].total} (${stats[t].count})`; radarLegend.appendChild(d); });
            const od = document.createElement('div'); od.className = 'radar-legend-item'; od.innerHTML = '<span class="radar-legend-dot overall"></span> Overall — ' + ovTotal + ' (' + ovCount + ')'; radarLegend.appendChild(od);
        }

            app.style.display = 'block';
            document.querySelector('.tabs').style.display = 'flex';
            document.querySelector('.search-wrapper').style.display = 'block';
            if (currentTab === 'list') bottomBar.style.display = 'flex';
            renderLevels();
        });

        profileNameInput.addEventListener('input', () => { profileName = profileNameInput.value || 'Uruman'; saveAll(); updateUI(); });

        // ====== COPY PROFILE ======
        copyProfileBtn.addEventListener('click', () => {
            let t = `Profile: ${profileName}\nPoints: ${formatPoints(totalPoints)}\nCompleted: ${completedIds.length} levels\nAchievements: ${earnedAchievements.length}/95\n\n`;

            const done = levels.filter(l => completedIds.includes(l.id));
            const stats = {};
            done.forEach(l => getTags(l.id).forEach(tg => { if (!stats[tg]) stats[tg] = { total: 0, count: 0 }; stats[tg].total += l.difficulty; stats[tg].count++; }));
            t += 'Skill Set:\n';
            Object.keys(stats).sort((a, b) => stats[b].total - stats[a].total).forEach(tg => t += `${tg} — ${stats[tg].total} (${stats[tg].count})\n`);
            t += `Overall — ${done.reduce((s, l) => s + l.difficulty, 0)} (${done.length})\n\n`;

            t += 'Completed Levels:\n';
            const as = getSorted(levels);
            completedIds.slice().reverse().forEach(id => {
                const l = levels.find(x => x.id === id);
                if (l) {
                    const r = as.findIndex(x => x.id === id) + 1;
                    const tgs = getTags(l.id);
                    t += `#${r} ${l.name} — diff: ${l.difficulty}, pts: ${formatPoints(l.number)}${tgs.length ? ' | ' + tgs.join(', ') : ''}\n`;
                }
            });

            t += '\nAchievements:\n';
            ACHIEVEMENTS.forEach(a => t += `${earnedAchievements.includes(a.id) ? '✓' : '✗'} ${a.name}\n`);

            const fb = () => { const ta = document.createElement('textarea'); ta.value = t.trim(); document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Profile copied!'); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(t.trim()).then(() => alert('Profile copied!')).catch(fb);
            } else { fb(); }
            trackCopyProfile();
        });

        // ====== EXPORT / IMPORT ======
        exportBtn.addEventListener('click', () => {
            const d = { levels, totalPoints, completedIds, profileName, legacyLevels, legacyDate, historyLog, prevSortedIds, allTags, levelTags, earnedAchievements, achStats, version: 3.2 };
            const j = JSON.stringify(d, null, 2);
            const bl = new Blob([j], { type: 'application/json' });
            const u = URL.createObjectURL(bl);
            const a = document.createElement('a');
            a.href = u; a.download = 'pointer-made-backup.json';
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(u);
            trackExport();
        });

        importBtn.addEventListener('click', () => importFileInput.click());
        importFileInput.addEventListener('change', function() {
            const f = importFileInput.files[0];
            if (!f) return;
            if (!confirm('Import will replace all current data. Continue?')) { importFileInput.value = ''; return; }
            const r = new FileReader();
            r.onload = function(e) {
                try {
                    const d = JSON.parse(e.target.result);
                    if (d.version !== 3 && d.version !== 3.1 && d.version !== 3.2) { alert('Incompatible file.'); importFileInput.value = ''; return; }
                    levels = d.levels || [];
                    totalPoints = parseFloat(d.totalPoints) || 0;
                    completedIds = d.completedIds || [];
                    profileName = d.profileName || 'Uruman';
                    legacyLevels = d.legacyLevels || [];
                    legacyDate = d.legacyDate || '';
                    historyLog = d.historyLog || [];
                    prevSortedIds = d.prevSortedIds || [];
                    allTags = d.allTags || [];
                    levelTags = d.levelTags || {};
                    earnedAchievements = d.earnedAchievements || [];
                    achStats = d.achStats || {};
                    saveAll();
                    initAchStats();
                    checkAchievements();
                    alert('Imported!');
                    location.reload();
                } catch (err) { alert('Error: ' + err.message); }
                importFileInput.value = '';
            };
            r.readAsText(f);
            trackImport();
        });

        // ====== KEYBOARD ======
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (modalOverlay.classList.contains('active')) { modalOverlay.classList.remove('active'); editingLevelId = null; }
                if (profilePage.classList.contains('active')) backBtn.click();
            }
            if (e.key === 'Enter' && modalOverlay.classList.contains('active') && !tagSuggestions.classList.contains('show')) modalOk.click();
        });

        // ====== INIT ======
        profileNameInput.value = profileName;
        checkLegacy();
        const cs = getSorted(levels).map(l => l.id);
        if (!prevSortedIds.length) { prevSortedIds = [...cs]; saveAll(); }
        checkAchievements();
        renderLevels();
    </script>
</body>
</html>
